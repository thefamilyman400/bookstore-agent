apiVersion: apps/v1
kind: Deployment
metadata:
  name: justbooks
  namespace: justbooks
spec:
  replicas: 2
  selector:
    matchLabels:
      app: justbooks
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: justbooks
    spec:
      containers:
        - name: justbooks
          image: justbooks:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: justbooks-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: justbooks-secret
                  key: JWT_SECRET
          volumeMounts:
            - name: db-storage
              mountPath: /data/db
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/info
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: justbooks-db